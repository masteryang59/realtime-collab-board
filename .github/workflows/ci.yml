name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        redis: [mini-redis, redis-8]
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (${{ matrix.redis }})
        run: npm test
        env:
          TEST_REDIS_URL: ${{ matrix.redis == 'redis-8' && 'redis://127.0.0.1:6379' || '' }}
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target realtime -t collab-realtime .
      - run: docker build --target web -t collab-web .

evict_stale:
  enabled: true

update_cache:
  enabled: true
evict_stale:
  enabled: true